name: Lint code
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 26
      # Prettier resolves prettier-plugin-astro from node_modules
      - run: npm ci
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # ratchet:j178/prek-action@v3.1.0

  nextflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nf-core/setup-nextflow@v3
      # The RNA-seq and machine learning examples include local modules, so can't be linted standalone
      - name: Extract example pipelines
        run: |
          mkdir -p examples
          for page in basic-pipeline mixing-scripting-languages blast-pipeline; do
            awk '/^```nextflow/{f=1;next} /^```/{f=0} f' "src/pages/$page.md" > "examples/$page.nf"
          done
      - run: nextflow lint examples
